name: Cross-Platform CMake CI

on:
  push:
    branches:
      - '*develop*'
      - '*master*'
  pull_request:
    branches:
      - '*develop*'
      - '*master*'

jobs:
  cross_build:
    name: Cross-platform build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run CI script (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x ci.sh || true
          ./ci.sh
        shell: bash

      - name: Run CI script (Windows)
        if: runner.os == 'Windows'
        run: .\ci.bat
        shell: cmd

      - name: Deploy
        run: |
          echo "Deploy step - replace with actual deployment commands"
        # Keep the deploy step generic; adjust conditionals or commands as needed.
